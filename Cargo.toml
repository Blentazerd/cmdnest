[package]
name = "cmdnest"
version = "0.0.1"
edition = "2026"
description = "Минималистичный и удобный терминальный мультиплексор"
license = "MIT"
repository = "https://github.com/Blentazerd/cmdnest"
readme = "README.md"

[dependencies]
# Основной фреймворк для TUI
ratatui = "0.29"
# Для управления терминалом (ввод/вывод, размеры, события)
crossterm = "0.28"
# Для создания псевдотерминалов (PTY)
portable-pty = "0.8"
# Парсер ANSI-последовательностей (превращает "сырой" вывод в сетку символов)
vt100 = "0.15"

[[bin]]
name = "CmdNest"
path = "src/main.rs"
