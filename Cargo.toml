[package]
name = "my-term-mux"
version = "0.0.3"
edition = "2026"
description = "Минималистичный терминальный мультиплексор на Rust"
license = "MIT"
repository = "https://github.com/Blentazerd/my-term-mux"
readme = "README.md"

[dependencies]
# Основной фреймворк для TUI
ratatui = "0.29"
# Для управления терминалом (ввод/вывод, размеры, события)
crossterm = "0.28"
# Для создания псевдотерминалов (PTY)
portable-pty = "0.8"
# Парсер ANSI-последовательностей (превращает "сырой" вывод в сетку символов)
vt100 = "0.15"
